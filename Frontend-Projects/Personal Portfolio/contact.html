<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Open Graph -->

  <meta property="og:title" content="Contact | Frontend Developer">
  <meta property="og:description" content="Contact page for reaching out to the frontend developer.">

  <meta property="og:image" content="">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Contact | Frontend Developer">
  <meta name="twitter:description" content="Contact page for reaching out to the frontend developer.">
  <meta name="twitter:image" content="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="navbar">
    <a href="index.html" class="logo" aria-label="Home">
      <span class="logo-icon">P</span>
      <span>Portfolio</span>
    </a>
    <nav aria-label="Primary navigation">
      <ul class="nav-menu">
        <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
        <li class="nav-item"><a href="projects.html" class="nav-link">Projects</a></li>
        <li class="nav-item"><a href="articles.html" class="nav-link">Articles</a></li>
        <li class="nav-item"><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>
    </nav>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">Dark</button>
  </header>

  <main>
    <section>
      <h1>Contact</h1>
      <p>Send a message using the form below.</p>

      <form action="#" method="post">
        <p>
          <label for="name">Name</label><br />
          <input type="text" id="name" name="name" required />
        </p>

        <p>
          <label for="email">Email</label><br />
          <input type="email" id="email" name="email" required />
        </p>

        <p>
          <label for="subject">Subject</label><br />
          <input type="text" id="subject" name="subject" />
        </p>

        <p>
          <label for="message">Message</label><br />
          <textarea id="message" name="message" rows="6" required></textarea>
        </p>

        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; All Rights Reserved <span id="year"></span></p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const html = document.documentElement;
    const btn = document.getElementById('theme-toggle');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)');

    function applyTheme(theme) {
      html.dataset.theme = theme;
      btn.textContent = theme === 'dark' ? 'Light' : 'Dark';
    }

    const saved = localStorage.getItem('theme');
    applyTheme(saved ?? (systemDark.matches ? 'dark' : 'light'));

    btn.addEventListener('click', () => {
      const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });
  </script>
</body>

</html>
