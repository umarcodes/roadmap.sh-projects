<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date Picker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <div class="datepicker">
        <div class="input-row">
          <input
            type="text"
            class="date-input"
            placeholder="dd / mm / yyyy"
            readonly
          />
          <button class="cal-btn" aria-label="Open calendar">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </button>
        </div>

        <div class="calendar">
          <div class="cal-header">
            <button class="nav" aria-label="Previous month">&#9664;</button>
            <span class="month-label">December 2022</span>
            <button class="nav" aria-label="Next month">&#9654;</button>
          </div>

          <div class="cal-grid" id="cal-grid"></div>
        </div>
      </div>
    </div>

    <script>
      const grid = document.getElementById("cal-grid");

      const dayNames = ["S", "M", "T", "W", "T", "F", "S"];
      const offset = 4; // Dec 1 2022 = Thursday
      const days = 31;

      const append = (className, text = "") => {
        const el = document.createElement("span");
        el.className = className;
        el.textContent = text;
        grid.appendChild(el);
      };

      dayNames.forEach(name => append("day-name", name));
      for (let i = 0; i < offset; i++) append("day empty");
      for (let i = 0; i < days; i++) append("day");
    </script>
  </body>
</html>
