<div class="accordion">
  <div class="accordion-item">
    <button class="accordion-trigger" aria-expanded="false" aria-controls="content-1">
      Question 1
      <span class="accordion-icon" aria-hidden="true">+</span>
    </button>
    <div id="content-1" class="accordion-content">
      <div class="accordion-content-inner">
        <p>Answer to Question 1</p>
      </div>
    </div>
  </div>
  <div class="accordion-item">
    <button class="accordion-trigger" aria-expanded="false" aria-controls="content-2">
      Question 2
      <span class="accordion-icon" aria-hidden="true">+</span>
    </button>
    <div id="content-2" class="accordion-content">
      <div class="accordion-content-inner">
        <p>Answer to Question 2</p>
      </div>
    </div>
  </div>
</div>

<style>
  .accordion {
  max-width: 600px;
  margin: 0 auto;
  font-family: sans-serif;
  border: 1px solid #ddd;
  border-radius: 4px;
}

.accordion-item {
  border-bottom: 1px solid #ddd;
}

.accordion-item:last-child {
  border-bottom: none;
}

.accordion-trigger {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 15px 20px;
  background: #f9f9f9;
  border: none;
  font-size: 16px;
  font-weight: bold;
  text-align: left;
  cursor: pointer;
  transition: background 0.2s ease;
}

.accordion-trigger:hover,
.accordion-trigger:focus {
  background: #f0f0f0;
  outline: 2px solid #0056b3;
  outline-offset: -2px;
}

.accordion-icon {
  font-size: 20px;
  transition: transform 0.2s ease;
}

.accordion-trigger[aria-expanded="true"] .accordion-icon {
  transform: rotate(45deg);
}

.accordion-content {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.25s ease;
  overflow: hidden;
}

.accordion-content.is-open {
  grid-template-rows: 1fr;
}

.accordion-content-inner {
  min-height: 0;
  padding: 15px 20px;
  background: #fff;
  line-height: 1.5;
}
</style>
<script>
  document.querySelectorAll('.accordion-trigger').forEach(button => {
  button.addEventListener('click', () => {
    const isExpanded = button.getAttribute('aria-expanded') === 'true';

    // Close all others
    document.querySelectorAll('.accordion-trigger').forEach(other => {
      if (other !== button) {
        other.setAttribute('aria-expanded', 'false');
        document.getElementById(other.getAttribute('aria-controls')).classList.remove('is-open');
      }
    });

    // Toggle clicked item
    button.setAttribute('aria-expanded', !isExpanded);
    document.getElementById(button.getAttribute('aria-controls')).classList.toggle('is-open', !isExpanded);
  });
});
</script>
