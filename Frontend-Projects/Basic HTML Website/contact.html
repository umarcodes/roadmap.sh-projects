  <main class="main">
    <section class="contact-section">
      <h1 class="page-title">Contact</h1>
      <p class="page-subtitle">Send a message using the form below.</p>

      <form class="contact-form" action="#" method="post">
        <div class="form-group">
          <label class="form-label" for="name">Name</label>
          <input class="form-input" type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="subject">Subject</label>
          <input class="form-input" type="text" id="subject" name="subject" />
        </div>

        <div class="form-group">
          <label class="form-label" for="message">Message</label>
          <textarea class="form-textarea" id="message" name="message" rows="6" required></textarea>
        </div>

        <button class="form-submit" type="submit">Send</button>
      </form>
    </section>
  </main>
